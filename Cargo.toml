[package]
name = "hnl-engine-lex-pattern"
version = "0.1.0"
edition = "2024"
publish = false
description = "A data-driven lexer engine that reads [`LexerRuleDef`] fragments from a [`Language`] and tokenizes source text (ADR-0044 §1, §3)."
license = "MIT"
repository = "https://github.com/handl-lang/engine-lex-pattern"
homepage = "https://handl-lang.github.io/docs/engine-lex-pattern/"
documentation = "https://handl-lang.github.io/docs/engine-lex-pattern/reference/"
readme = "README.md"
keywords = ["handl", "engine", "lexer", "language-as-data"]
categories = ["development-tools", "compilers"]
# Git-install only: https://github.com/handl-lang/engine-lex-pattern (no crates.io).

[dependencies]
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
hnl-engine-lex = { git = "https://github.com/handl-lang/engine-lex", branch = "main" }

[dev-dependencies]
handl-kit-data-prelude = { git = "https://github.com/handl-lang/kit-data-prelude", branch = "main" }
